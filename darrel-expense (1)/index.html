/* ---------- restore from a restore file ---------- */
let restoreData=null;
function readRestore(file){
  const box=document.getElementById('restore-box');if(!file||!box)return;
  const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);if(!j||!j.config)throw 0;restoreData=j;
    box.innerHTML=`<div class="alert warn" style="margin-top:10px">Restore file from ${esc(dlabel(String(j.exported||'').slice(0,10)))}: ${(j.spends||[]).length} spending entries, ${Object.keys(j.plans||{}).length} monthly plans. Restoring puts this data back. Anything with the same entry is replaced; newer entries stay.<div class="row" style="margin-top:8px"><button class="btn danger" type="button" data-act="dorestore">Restore now</button></div></div>`;}
    catch(_){box.innerHTML='<div class="alert bad" style="margin-top:10px">That file is not a Darrel Expense Tracker restore file.</div>';}};
  rd.readAsText(file);
}
async function doRestore(){
  const j=restoreData;if(!j)return;
  const b=document.querySelector('[data-act=dorestore]');if(b&&!armDelete(b))return;
  await put(path('cfg','main'),j.config);
  for(const [mk,v] of Object.entries(j.plans||{}))await put(path('plans',mk),v);
  for(const x of j.spends||[])await put(path('spends',x.id),x);
  for(const [mk,v] of Object.entries(j.saves||{}))await put(path('saves',mk),v);
  for(const [mk,v] of Object.entries(j.instPaid||{}))await put(path('inst',mk),v);
  for(const x of j.cardPays||[])await put(path('pays',x.id),x);
  for(const x of j.incomes||[])await put(path('income',x.id),x);
  for(const [mk,v] of Object.entries(j.received||{}))await put(path('recv',mk),v);
  restoreData=null;dropDrafts();toast('Restored');render();
}

  T(`${mlabel(mk)} report · made ${new Date().toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}`,M,y+26,{s:24,c:K.muted});y+=56;
  RECT(M,y,W-2*M,130,K.as,16);T('Left this month',M+24,y+42,{s:26,w:600,c:K.a});T(A(Mo.leftPlan),M+24,y+98,{s:44,w:500,mono:true,c:Mo.leftPlan<0?K.bad:K.a});y+=160;
  H('This month');const w2=[.6,.4];
  ROW(['Salary',A(Mo.salary)],w2);ROW(['Bills & budgets',A(Mo.planned)],w2);ROW(['Savings',A(Mo.savings)],w2);ROW(['Left',A(Mo.leftPlan)],w2,{w:700});

function dataURLBytes(u){const b=atob(u.split(',')[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function buildPdf(pagesJpeg,imgW,imgH){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length;};
  const obj=(n,body)=>{offs[n]=len;push(`${n} 0 obj\n`);body();push('\nendobj\n');};
  push('%PDF-1.4\n');
  const n=pagesJpeg.length,kids=[];for(let i=0;i<n;i++)kids.push(`${3+i*3} 0 R`);
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push(`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${n} >>`));
  pagesJpeg.forEach((jpg,i)=>{const pg=3+i*3,ct=pg+1,im=pg+2,cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(pg,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>`));
    obj(ct,()=>{push(`<< /Length ${cs.length} >>\nstream\n`);push(cs);push('\nendstream');});
    obj(im,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);push('\nendstream');});});
  const total=2+n*3,xref=len;
  let x=`xref\n0 ${total+1}\n0000000000 65535 f \n`;for(let i=1;i<=total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x);push(`trailer\n<< /Size ${total+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
async function saveFile(blob,name){
  try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){await navigator.share({files:[f],title:name});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
async function downloadBackup(kind){
  const stamp=today();try{await document.fonts.ready;}catch(_){}
  if(kind==='pdf'){const {cv,W,PH,pages}=reportCanvas(true),jpgs=[];
    for(let i=0;i<pages;i++){const pc=document.createElement('canvas');pc.width=W;pc.height=PH;pc.getContext('2d').drawImage(cv,0,i*PH,W,PH,0,0,W,PH);jpgs.push(dataURLBytes(pc.toDataURL('image/jpeg',0.9)));}
    await saveFile(buildPdf(jpgs,W,PH),`darrel-report-${stamp}.pdf`);toast('PDF report ready');}
  else if(kind==='png'){const {cv}=reportCanvas(false);const blob=await new Promise(r=>cv.toBlob(r,'image/png'));await saveFile(blob,`darrel-report-${stamp}.png`);toast('Photo ready');}
  else{await saveFile(new Blob([JSON.stringify({exported:new Date().toISOString(),config:S.config,plans:S.plans,spends:S.spends,saves:S.saves,instPaid:S.instPaid,cardPays:S.cardPays,incomes:S.incomes,received:S.received},null,2)],{type:'application/json'}),`darrel-restore-${stamp}.json`);toast('Restore file saved');}
}


/* ---------- swipe between tabs ---------- */
(function(){
  let x0=null,y0=0,t0=0,skip=false,tw=null,twL=0;
  document.addEventListener('touchstart',e=>{
    if(screen!=='app'||tab==='guide'||e.touches.length!==1){x0=null;return;}
    const t=e.target;if(!t.closest('#view')){x0=null;return;}
    tw=t.closest('.tablewrap');if(tw&&tw.scrollWidth<=tw.clientWidth+2)tw=null;twL=tw?tw.scrollLeft:0;skip=!!t.closest('input,select,textarea,.bnav');
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(x0==null||skip)return;
    const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0,dt=Date.now()-t0;x0=null;
    if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)*0.6||dt>800)return;
    if(tw){const atStart=twL<=2,atEnd=twL>=tw.scrollWidth-tw.clientWidth-2;if((dx<0&&!atEnd)||(dx>0&&!atStart))return;}
    const d=dx<0?1:-1,i=(tab==='add'?(d>0?0:NAV.length-1)-d:NAV.indexOf(tab))+d;if(i<0||i>=NAV.length)return;
    if(!canLeave())return;tab=NAV[i];dirty=false;try{history.replaceState(null,'','#'+tab);}catch(_){}render();
    const v=document.getElementById('view');v.classList.remove('slide-l','slide-r');void v.offsetWidth;v.classList.add(d>0?'slide-l':'slide-r');window.scrollTo(0,0);
  },{passive:true});
})();

/* ---------- gate & boot ---------- */
window.addEventListener('error',e=>{try{const v=document.getElementById('li-status');if(v){v.hidden=false;v.textContent='Error: '+(e.message||'unknown');}}catch(_){}});
window.addEventListener('unhandledrejection',e=>{try{const v=document.getElementById('li-status');if(v){v.hidden=false;v.textContent='Error: '+((e.reason&&(e.reason.code||e.reason.message))||'unknown');}}catch(_){}});
function renderGate(){
  document.getElementById('tabs').innerHTML='';document.getElementById('tabs').hidden=true;document.getElementById('who').textContent='';
  document.getElementById('signout').hidden=screen!=='denied';
  const v=document.getElementById('view');
  if(screen==='loading'){v.innerHTML='<div class="empty">Loading…</div>';return;}
  if(screen==='config'){v.innerHTML=`<section class="block" style="max-width:520px;margin:0 auto"><h2>Connect to the internet once</h2><p>The app needs internet the first time it opens on this phone. After that it works offline. <button class="btn ghost small" data-act="preview">Open a preview instead</button></p></section>`;return;}
  if(screen==='denied'){v.innerHTML=`<section class="block" style="max-width:520px;margin:0 auto"><h2>No access</h2><p>${esc(userEmail)} is signed in but isn't allowed to open this tracker. Ask Gherwin to check the Firebase rules.</p></section>`;return;}
  v.innerHTML=`<section class="block" style="max-width:420px;margin:24px auto 0"><h2>Sign in</h2><p class="small muted">Darrel's expense tracker.</p>
   <form class="f" id="loginform" novalidate onsubmit="return false" action="#">
    <div class="field"><label for="li-e">Username</label><input id="li-e" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required value="${esc(gateEmail)}"></div>
    <div class="field"><label for="li-p">Password</label><input id="li-p" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <label class="row small" style="gap:6px"><input type="checkbox" id="li-show" style="width:18px;height:18px"> Show password</label></div>
    <p class="small" style="color:var(--bad);margin:0" ${gateMsg?'':'hidden'}>${esc(gateMsg)}</p>
    <p class="small muted" id="li-status" style="margin:0" hidden></p>
    <div class="row"><button class="btn primary" type="submit">Sign in</button></div>
    <p class="small muted" style="margin:0">Forgot the password? Ask Gherwin to reset it.</p>
   </form></section>`;
}
function bootOffline(){offline=true;screen='app';S.config=clone(D.DEFAULT_CONFIG);Object.keys(S.ready).forEach(k=>S.ready[k]=true);render();}
function unsubAll(){subs.forEach(f=>{try{f();}catch(_){}});subs=[];}
function maybeSeed(){if(seeded||!S.ready.cfg)return;seeded=true;if(!S.config)put(path('cfg','main'),clone(D.DEFAULT_CONFIG));}
function subscribe(){
  const fail=err=>{if(err&&err.code==='permission-denied'){unsubAll();screen='denied';render();return;}if(!Object.values(S.ready).every(Boolean)){const v=document.getElementById('view');if(v)v.innerHTML=`<div class="alert bad">Could not load your data (${esc((err&&err.code)||'unknown')}). ${err&&err.code==='failed-precondition'||err&&err.code==='not-found'?'The Firestore database may not be created yet in Firebase.':'Check your internet and reload.'}</div>`;}};
  const coll=(name,key,fn)=>subs.push(db.collection(name).onSnapshot(q=>{fn(q);S.ready[key]=true;render(true);},fail));
  subs.push(db.doc(path('cfg','main')).onSnapshot(s=>{S.config=s.exists?s.data():null;S.ready.cfg=true;maybeSeed();render(true);},fail));
  coll(COL.plans,'plans',q=>{S.plans={};q.docs.forEach(d=>S.plans[d.id]=d.data());});
  coll(COL.spends,'spends',q=>{S.spends=q.docs.map(d=>Object.assign({id:d.id},d.data()));});
  coll(COL.saves,'saves',q=>{S.saves={};q.docs.forEach(d=>S.saves[d.id]=d.data());});
  coll(COL.inst,'inst',q=>{S.instPaid={};q.docs.forEach(d=>S.instPaid[d.id]=d.data());});
  coll(COL.pays,'pays',q=>{S.cardPays=q.docs.map(d=>Object.assign({id:d.id},d.data()));});
  coll(COL.income,'income',q=>{S.incomes=q.docs.map(d=>Object.assign({id:d.id},d.data()));});
  coll(COL.recv,'recv',q=>{S.received={};q.docs.forEach(d=>S.received[d.id]=d.data());});
}
function boot(){
  const fc=window.FIREBASE_CONFIG||{};
  if(!window.firebase||!fc.apiKey){screen='config';render();return;}
  firebase.initializeApp(fc);auth=firebase.auth();db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(_){}
  auth.onAuthStateChanged(u=>{
    unsubAll();
    if(!u){screen='login';render();return;}
    userEmail=(u.email||'').toLowerCase().replace('@'+USER_DOMAIN,'');gateMsg='';screen='app';seeded=false;
    Object.keys(S.ready).forEach(k=>S.ready[k]=false);
    document.getElementById('view').innerHTML='<div class="empty">Loading your tracker…</div>';
    render();subscribe();
    setTimeout(()=>{if(screen==='app'&&!Object.values(S.ready).every(Boolean)){const v=document.getElementById('view');if(v&&/Loading/.test(v.textContent))v.innerHTML='<div class="alert info">Still loading. If this stays, check that the Firestore database exists in the darrel-expense Firebase project and that its rules are published.</div>';}},12000);
  });
}
document.getElementById('signout').addEventListener('click',()=>{if(auth)auth.signOut();});
(function(){const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h)&&h!=='guide')tab=h;})();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
render();
try{boot();}catch(_){screen='config';render();}
})();

</script>
</body>
